syntax = "proto3";

package root.profile.v1;

import "buf/validate/validate.proto";
import "common/profile/v1/profile.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

service RootProfileService {
  // Profile
  rpc Profile(ProfileRequest) returns (ProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // About
  rpc About(AboutRequest) returns (AboutResponse);
  rpc UpdateAbout(UpdateAboutRequest) returns (UpdateAboutResponse);

  // Domains
  rpc Domains(DomainsRequest) returns (DomainsResponse);
  rpc Domain(DomainRequest) returns (DomainResponse);
  rpc DeleteDomain(DeleteDomainRequest) returns (DeleteDomainResponse);

  // Nameservers
  rpc Nameservers(NameserversRequest) returns (NameserversResponse);
  rpc Nameserver(NameserverRequest) returns (NameserverResponse);
  rpc CreateNameserver(CreateNameserverRequest) returns (CreateNameserverResponse);
  rpc DeleteNameserver(DeleteNameserverRequest) returns (DeleteNameserverResponse);

  // Educations
  rpc Education(EducationRequest) returns (EducationResponse);
  rpc UpdateEducation(UpdateEducationRequest) returns (UpdateEducationResponse);
  rpc Educations(EducationsRequest) returns (EducationsResponse);
  rpc DeleteEducation(DeleteEducationRequest) returns (DeleteEducationResponse);

  // Experience
  rpc Experience(ExperienceRequest) returns (ExperienceResponse);
  rpc UpdateExperience(UpdateExperienceRequest) returns (UpdateExperienceResponse);
  rpc Experiences(ExperiencesRequest) returns (ExperiencesResponse);
  rpc DeleteExperience(DeleteExperienceRequest) returns (DeleteExperienceResponse);

  // Icons
  rpc Icons(IconsRequest) returns (IconsResponse);
  rpc Icon(IconRequest) returns (IconResponse);
  rpc CreateIcon(CreateIconRequest) returns (CreateIconResponse);
  rpc UpdateIcon(UpdateIconRequest) returns (UpdateIconResponse);
  rpc DeleteIcon(DeleteIconRequest) returns (DeleteIconResponse);

  // Templates
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc Templates(TemplatesRequest) returns (TemplatesResponse);
  rpc TemplateIcons(TemplateIconsRequest) returns (TemplateIconsResponse);
  rpc Template(TemplateRequest) returns (TemplateResponse);

  // Social
  rpc UpdateSocial(UpdateSocialRequest) returns (UpdateSocialResponse);
  rpc Socials(SocialsRequest) returns (SocialsResponse);
  rpc Social(SocialRequest) returns (SocialResponse);
  rpc DeleteSocial(DeleteSocialRequest) returns (DeleteSocialResponse);
}

// Profile
message Profile {
  string user_id = 1;
  string name = 2;
  string title = 3;
  google.protobuf.Timestamp dob = 4;
  google.protobuf.Timestamp created_at = 5;
  string created_by = 6;
  google.protobuf.Timestamp updated_at = 7;
  string updated_by = 8;
  string created_by_username = 9;
  string updated_by_username = 10;
}

message ProfileRequest {
  string user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message ProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  common.profile.v1.CreateUpdateProfile profile = 2 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 3 [(buf.validate.field).required = true];
}

message UpdateProfileResponse {
  Profile profile = 1;
}

