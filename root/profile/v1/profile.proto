message CreateUpdateIcon {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 24
      pattern: "^[a-zA-Z0-9]+( [a-zA-Z0-9]+)*$"
    },
    (buf.validate.field).cel = {
      id: "name_no_consecutive_dots_underscore_hyphen"
      message: "name must not contain consecutive dots or underscore or hyphen"
      expression: "!this.matches('.*([ ]{2,}).*')"
    }
  ];
  string site_hostname = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 4
      max_len: 254
      hostname: true
    }
  ];
  google.protobuf.StringValue site_suffix = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 32
      pattern: "^\\/[a-zA-Z0-9_@.~-]*\\/?$"
    },
    (buf.validate.field).cel = {
      id: "site_suffix_no_consecutive_repeat_specials"
      message: "site_suffix must not contain consecutive slashes, dots, underscores, or hyphens"
      expression: "!this.matches('.*(//|\\\\.\\\\.|--|__|~~).*')"
    }
  ];
  string hostname = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 4
      max_len: 254
      hostname: true
    }
  ];
  string suffix = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[a-zA-Z0-9]([a-zA-Z0-9/-]*[a-zA-Z0-9])?(\\.svg)?$"
    },
    (buf.validate.field).cel = {
      id: "suffix_no_consecutive_dots_underscore_hyphen"
      message: "suffix must not contain consecutive dots or underscore or hyphen"
      expression: "!this.matches('.*([/-]{2,}).*')"
    }
  ];
  string color = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      len: 7
      pattern: "^#[0-9a-fA-F]{6}$"
    }
  ];
}

message DeleteSocialRequest {
  string id = 1 [
    (buf.validate.field).required = true,
