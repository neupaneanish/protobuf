syntax = "proto3";

package gateway.platform.v1;

service PlatformService {
  rpc List(ListRequest) returns (ListResponse);
}

message ListRequest {}

message ListResponse {
  repeated Platform platforms = 1;
}

message Platform {
  string id = 1;
  string name = 2;
  string url = 3;
  string logo_url = 4;
  string color = 5;
}
