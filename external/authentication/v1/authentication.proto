syntax = "proto3";

package external.authentication.v1;

import "buf/validate/validate.proto";
import "common/password/v1/password.proto";
import "google/protobuf/timestamp.proto";

enum VerificationMethod {
  VERIFICATION_METHOD_UNSPECIFIED = 0;
  VERIFICATION_METHOD_ACCOUNT = 1;
  VERIFICATION_METHOD_EMAIL = 2;
  VERIFICATION_METHOD_TWO_FACTOR = 3;
  VERIFICATION_METHOD_RESET = 4;
}

service ExternalAuthenticationService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ForgetPassword(ForgetPasswordRequest) returns (ForgetPasswordResponse);
  rpc Verification(VerificationRequest) returns (VerificationResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc Resend(ResendRequest) returns (ResendResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
}

message RegisterRequest {
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
  common.password.v1.Password password = 2 [(buf.validate.field).required = true];
  common.password.v1.Password confirm_password = 3 [(buf.validate.field).required = true];
  string phone = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 10
      max_len: 16
      pattern: "^\\+[1-9]\\d{1,14}$"
    }
  ];

  option (buf.validate.message).cel = {
    id: "password_match"
    expression: "this.password.value == this.confirm_password.value"
    message: "passwords must match"
  };
}

message RegisterResponse {
  VerificationSession verification = 1;
}

message LoginRequest {
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
  common.password.v1.Password password = 2 [(buf.validate.field).required = true];
}

message LoginResponse {
  oneof response {
    Token token = 1;
    VerificationSession verification = 2;
  }
}

message Token {
  string access = 1;
  string refresh = 2;
  google.protobuf.Timestamp expire_at = 3;
}

message ForgetPasswordRequest {
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
}

message ForgetPasswordResponse {
  VerificationSession verification = 1;
}

message VerificationRequest {
  string session = 1 [(buf.validate.field).required = true];
  oneof code {
    option (buf.validate.oneof).required = true;

    string totp = 2 [(buf.validate.field).string = {
      len: 6
      pattern: "^[0-9]+$"
    }];
    string email = 3 [(buf.validate.field).string = {
      len: 8
      pattern: "^[A-Z0-9]+$"
    }];
    string recovery = 4 [(buf.validate.field).string = {
      len: 10
      pattern: "^[A-Z0-9]+$"
    }];
  }
}

message VerificationResponse {
  oneof response {
    Token token = 1;
    VerificationSession verification = 2;
    ResetSession reset_session = 3;
  }
}

message ResetPasswordRequest {
  string session = 1 [(buf.validate.field).required = true];
  common.password.v1.Password password = 2 [(buf.validate.field).required = true];
  common.password.v1.Password confirm_password = 3 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "password_mismatch"
    expression: "this.password.value == this.confirm_password.value"
    message: "Password and confirm password must match"
  };
}

message ResetPasswordResponse {}

message ResendRequest {
  string session = 1 [(buf.validate.field).required = true];
}

message ResendResponse {
  string session = 1;
}

message RefreshRequest {
  string refresh = 1 [(buf.validate.field).required = true];
}

message RefreshResponse {
  Token token = 1;
}

message VerificationSession {
  string session = 1;
  VerificationMethod method = 2;
}

message ResetSession {
  string session = 1;
}
